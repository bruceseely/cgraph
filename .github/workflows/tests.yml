name: whole-stack tests

# A push to cgraph runs the whole-stack gate (owned by cg-from-parse) against
# THIS repo's pushed code plus current parsifal and cg-from-parse, each suite in
# its own SBCL process. Self-contained: no cross-repo token needed -- the two
# dependency repos are public and checked out directly.
#
# A second job runs cgraph's own suite on ECL, to keep it portable.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  whole-stack:
    runs-on: ubuntu-latest
    # The gate takes about two minutes. A hang used to run to GitHub's six-hour
    # default; this fails it in minutes instead.
    timeout-minutes: 15
    env:
      # Make every checked-out repo ASDF-discoverable; ql:quickload falls back to
      # ASDF for systems not in the Quicklisp dist.
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}") :inherit-configuration)'
    steps:
      - name: Checkout cgraph (this repo, pushed ref)
        uses: actions/checkout@v4
        with:
          path: cgraph

      - name: Checkout parsifal
        uses: actions/checkout@v4
        with:
          repository: bruceseely/parsifal
          path: parsifal
          token: ${{ secrets.STACK_CHECKOUT_TOKEN }}

      - name: Checkout cg-from-parse
        uses: actions/checkout@v4
        with:
          repository: bruceseely/cg-from-parse
          path: cg-from-parse
          token: ${{ secrets.STACK_CHECKOUT_TOKEN }}

      # The official binary, pinned to the version development runs on. Ubuntu's
      # apt package was SBCL 2.2.9, four years older, and the extractor suite
      # failed under it while passing on 2.6.6.
      - name: Install SBCL
        env:
          SBCL_VERSION: 2.6.6
        run: |
          curl -sSL -o /tmp/sbcl.tar.bz2 \
            "https://downloads.sourceforge.net/project/sbcl/sbcl/${SBCL_VERSION}/sbcl-${SBCL_VERSION}-x86-64-linux-binary.tar.bz2"
          tar -xjf /tmp/sbcl.tar.bz2 -C /tmp
          (cd /tmp/sbcl-${SBCL_VERSION}-x86-64-linux && sudo sh install.sh)
          sbcl --version

      - name: Cache Quicklisp
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}

      - name: Bootstrap Quicklisp + SBCL init
        run: |
          if [ ! -f ~/quicklisp/setup.lisp ]; then
            curl -sSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive --load /tmp/quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install)'
          fi
          # Always (re)write ~/.sbclrc so it works on a Quicklisp cache hit too:
          # load Quicklisp, and unlock the CL package. cgraph no longer needs the
          # unlock (it shadows SET and TYPE); parsifal still declares CL symbols
          # such as NTH special, though it also unlocks CL itself on load.
          printf '%s\n' \
            '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' \
            '(sb-ext:unlock-package :common-lisp)' > ~/.sbclrc

      - name: Run whole-stack gate
        run: bash cg-from-parse/test/run-all-suites.sh

  # cgraph's own suite on a second implementation, so portability stays tested:
  # ECL found three bugs SBCL had been tolerating (see notes/release-issues.md).
  # cgraph only -- parsifal and the extractor are SBCL-only for now.
  ecl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CL_SOURCE_REGISTRY: '(:source-registry (:tree "${{ github.workspace }}") :inherit-configuration)'
    steps:
      - name: Checkout cgraph (this repo, pushed ref)
        uses: actions/checkout@v4
        with:
          path: cgraph

      - name: Install ECL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ecl
          ecl --version

      - name: Cache Quicklisp
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-ecl-${{ runner.os }}

      - name: Bootstrap Quicklisp
        run: |
          if [ ! -f ~/quicklisp/setup.lisp ]; then
            curl -sSL -o /tmp/quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
            ecl --norc --load /tmp/quicklisp.lisp \
                --eval '(quicklisp-quickstart:install)' --eval '(ext:quit 0)'
          fi

      # TEST-SYSTEM signals an error when a suite fails; turn that (or a load
      # failure) into exit 1 rather than leaving ECL waiting in its debugger.
      - name: Run cgraph tests on ECL
        run: |
          ecl --norc --load ~/quicklisp/setup.lisp \
              --eval '(handler-case (progn (ql:quickload "cgraph/tests")
                                           (asdf:test-system :cgraph)
                                           (ext:quit 0))
                        (error (e) (format t "~&~a~%" e) (ext:quit 1)))'
