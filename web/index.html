<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGraph Type Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── top bar ── */
    #top-bar {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
      min-height: 2.5rem;
      flex-shrink: 0;
    }

    /* ── mode toggle ── */
    #mode-toggle {
      display: none;   /* hidden until re-enabled */
      margin-left: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow: hidden;
      align-self: center;
      flex-shrink: 0;
    }

    #mode-toggle:not([hidden]) { display: flex; }

    .mode-btn {
      padding: 0.18rem 0.65rem;
      border: none;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 12px;
      color: #555;
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn + .mode-btn { border-left: 1px solid #ccc; }

    .mode-btn.active {
      background: #4a90d9;
      color: #fff;
    }

    .mode-btn:not(.active):hover { background: #e0e0e0; }

    /* ── mode hint bar ── */
    #mode-hint {
      padding: 0.22rem 0.75rem;
      font-size: 11px;
      color: #7a6a00;
      background: #fffbe6;
      border-bottom: 1px solid #e8d96a;
      flex-shrink: 0;
    }

    #top-bar-label {
      color: #888;
      white-space: nowrap;
      line-height: 1.8rem;
      flex-shrink: 0;
    }

    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      background: #4a90d9;
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      transition: background 0.15s;
      text-transform: uppercase;
    }
    .chip:hover { background: #c0392b; }
    .chip-x { font-size: 11px; opacity: 0.8; }

    #error-msg {
      color: #c00;
      padding: 0.25rem 0.75rem;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* ── body row ── */
    #body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── sidebar ── */
    #sidebar {
      width: 190px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 0.5rem 0.75rem 0.3rem;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    #save-btn, #init-btn {
      align-self: center;
      flex-shrink: 0;
      font-size: 11px;
      padding: 0.18rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    #save-btn { margin-left: auto; }
    #save-btn:hover:not(:disabled) { background: #e8e8e8; border-color: #aaa; }
    #save-btn:disabled { color: #bbb; cursor: default; }
    #save-status {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
      align-self: center;
      margin-left: 0.4rem;
    }
    #save-status:not(:empty) { cursor: pointer; }
    #save-status:not(:empty):hover { color: #555; text-decoration: underline; }
    #init-btn { margin-left: 0.4rem; }
    #init-btn:hover:not(:disabled) { background: #e8e8e8; border-color: #aaa; }
    #init-btn:disabled { color: #bbb; cursor: default; }

    #type-list {
      overflow-y: auto;
      flex: 1;
    }

    .type-item {
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
      text-transform: uppercase;
    }
    .type-item:hover { background: #f0f4ff; }
    .type-item.selected {
      color: #aaa;
      font-style: italic;
    }

    /* ── main column (graph + detail) ── */
    #main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── graph area ── */
    #graph-area {
      flex: 1;
      overflow: auto;
      padding: 0.75rem 0.75rem 0.5rem;
      min-height: 0;
    }

    #graph-container {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 80px;
      padding: 0.5rem;
      display: inline-block;
      min-width: 100%;
    }

    #graph-container svg { display: block; }

    #placeholder {
      color: #bbb;
      padding: 2rem;
      text-align: center;
    }

    /* ── detail pane ── */
    #detail-pane {
      flex-shrink: 0;
      border-top: 2px solid #ddd;
      background: #fff;
      display: none;        /* shown when a node is clicked */
    }

    #detail-pane.visible { display: flex; flex-direction: column; }

    /* ── canonical graph row ── */
    #canonical-row {
      padding: 0.35rem 0.75rem;
      border-bottom: 1px solid #eee;
      background: #f9f9f9;
    }

    #canonical-label {
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #aaa;
      margin-bottom: 0.15rem;
    }

    #canonical-value {
      font-family: monospace;
      font-size: 12.5px;
      color: #333;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #detail-header {
      padding: 0.4rem 0.75rem;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    #detail-header span {
      color: #333;
    }

    #detail-cols {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .detail-col {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .detail-col + .detail-col { border-top: 1px solid #eee; }

    .detail-col-header {
      padding: 0.3rem 0.75rem;
      font-size: 11px;
      font-weight: bold;
      color: #aaa;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }

    /* Grid layout: name | graph | desc — columns shared across all rows */
    .detail-col-body {
      display: grid;
      grid-template-columns: max-content max-content 1fr;
      align-items: baseline;
      max-height: 140px;
      overflow-y: auto;
      padding: 0.2rem 0;
    }

    /* Each rel-item is invisible as a box; its children become the grid cells */
    .rel-item { display: contents; }

    .rel-item.exact .rel-name { font-weight: bold; }

    .rel-item:hover .rel-name,
    .rel-item:hover .rel-graph,
    .rel-item:hover .rel-desc { background: #f0f4ff; }

    .rel-name {
      font-family: monospace;
      font-size: 11px;
      background: #ebebeb;
      color: #555;
      padding: 0.18rem 0.4em;
      border-radius: 2px;
      margin: 0.1rem 0 0.1rem 0.75rem;
      white-space: nowrap;
    }

    .rel-graph {
      font-family: monospace;
      font-size: 11px;
      color: #444;
      padding: 0.18rem 1.25rem 0.18rem 0.6rem;
      white-space: nowrap;
    }

    .rel-desc {
      font-size: 12px;
      color: #777;
      padding: 0.18rem 0.75rem 0.18rem 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rel-empty {
      grid-column: 1 / -1;
      padding: 0.4rem 0.75rem;
      color: #ccc;
      font-style: italic;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="top-bar-label">Graphing:</span>
    <div id="chips"></div>
    <div id="mode-toggle" hidden>
      <button class="mode-btn active" data-mode="info"
              title="Click a node to see its relations">Info</button>
      <button class="mode-btn" data-mode="edit"
              title="Left-click: expand/collapse subtypes · Right-click: expand/collapse supertypes">Edit</button>
    </div>
    <button id="save-btn" title="Save graph to data directory" disabled>Save</button>
    <span id="save-status"></span>
    <button id="init-btn" title="Reinitialize concept types">Initialize</button>
  </div>

  <div id="mode-hint" hidden>
    Edit&nbsp;mode:&ensp;left-click a node to expand/collapse its subtypes
    &ensp;&middot;&ensp;right-click any node (either mode) to select/deselect it
  </div>

  <div id="error-msg"></div>

  <div id="body-row">

    <div id="sidebar">
      <div id="sidebar-header">Concept Types</div>
      <div id="type-list"></div>
    </div>

    <div id="main-col">

      <div id="graph-area">
        <div id="graph-container">
          <div id="placeholder">Select a type from the list on the left.</div>
        </div>
      </div>

      <div id="detail-pane">
        <div id="canonical-row" hidden>
          <div id="canonical-label">Canonical graph</div>
          <div id="canonical-value"></div>
        </div>
        <div id="detail-header">Relations for <span id="detail-type-name"></span></div>
        <div id="detail-cols">
          <div class="detail-col">
            <div class="detail-col-header">As Input</div>
            <div class="detail-col-body" id="col-input"></div>
          </div>
          <div class="detail-col">
            <div class="detail-col-header">As Output</div>
            <div class="detail-col-body" id="col-output"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="/graph.js"></script>
</body>
</html>
