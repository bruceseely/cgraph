<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGraph Type Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── top bar ── */
    #top-bar {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: #fff;
      /* thick dark top rule so the app is clearly separate from browser chrome
         (bookmarks bar) sitting directly above it */
      border-top: 4px solid #333;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
      min-height: 2.5rem;
      flex-shrink: 0;
    }

    #top-bar-label {
      color: #888;
      white-space: nowrap;
      line-height: 1.8rem;
      flex-shrink: 0;
    }

    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      background: #4a90d9;
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      transition: background 0.15s;
      text-transform: uppercase;
    }
    .chip:hover { background: #c0392b; }
    .chip-x { font-size: 11px; opacity: 0.8; }

    /* Every button in the bar, selected by PLACE rather than by name. This was a
       hand-kept list of ids -- #save-btn, #init-btn, #new-type-btn, #edit-type-btn
       -- so it styled only the buttons someone had remembered to add to it.
       #new-rel-btn and #editor-btn were both missing and fell through to the
       browser's own chrome: 13.3px rather than 11px, a 2px border, square
       corners. A selector that matches the bar cannot be forgotten by the next
       button put in it. */
    /* Smaller than the forms' 11px, and spaced by the bar's own 0.5rem gap rather
       than that plus a per-button 0.4rem, because the bar's scarce resource is
       WIDTH: everything the button group takes is width the selected-type chips
       do not get before they push it onto a second row. Measured at 1196px, the
       group goes 529px -> 437px, and the chips 573px -> 665px, which is about
       half a long type name. The buttons are a fixed cost paid on every screen;
       the chips are what the bar is actually for. */
    #top-bar button {
      align-self: center;
      flex-shrink: 0;
      font-size: 10px;
      padding: 0.15rem 0.4rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    /* :not(.active):not(.open) so hovering a button that is currently ON does not
       grey out the state it is showing. Without them this rule outranks
       #edit-type-btn.active and #options-btn.open, which it used not to. */
    #top-bar button:hover:not(:disabled):not(.active):not(.open) {
      background: #e8e8e8;
      border-color: #aaa;
    }
    #edit-type-btn.active { background: #e0e9fb; border-color: #a9bde8; color: #33507a; }
    #nt-label[readonly] { background: #eee; color: #666; cursor: default; }

    #new-type-form {
      display: flex;
      align-items: flex-start;   /* top-justify: tall textareas don't recenter the row */
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.35rem 0.6rem;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
    }
    /* nudge single-line controls down to line up with the textareas' first line */
    #new-type-form > input,
    #new-type-form > span,
    #new-type-form > button { margin-top: 1px; }
    #new-type-form[hidden] { display: none; }
    #new-type-form input,
    #new-type-form textarea {
      font-size: 12px;
      padding: 0.18rem 0.4rem;
      border: none;            /* the #nt-fields container draws the single frame */
      border-radius: 0;
      background: transparent;
    }
    #new-type-form textarea {
      font-family: inherit;
      line-height: 1.4;
      resize: none;            /* heights are coupled to the tallest field (see JS) */
      overflow-y: auto;
      min-height: 1.55rem;
      max-height: 12rem;
    }

    /* ── the editor fields as one partitioned bar ── */
    /* name | supertypes | canonical | note: a single framed row, all cells the
       same height (align-items: stretch), divided by vertical rules, no per-field
       borders — so it reads as one pane with partitions. */
    #nt-fields {
      display: flex;
      align-items: stretch;
      flex: 1 1 auto;          /* grow to fill, but leave the buttons room on the same row */
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      overflow: hidden;        /* keep cell corners inside the rounded frame */
    }
    /* divider between panes — the extra #id keeps specificity above the
       per-field `border: none` rule, so textarea cells get their line too */
    #new-type-form #nt-fields > * + * { border-left: 1px solid #ccc; }
    #nt-fields > * { min-width: 0; }                       /* let cells shrink to fit */
    #nt-sep { align-self: flex-start; margin: 0.12rem 0.15rem 0 0; } /* ⊑ leads the supertypes, not its own cell */
    #nt-label     { width: 9rem; flex-shrink: 0; }
    /* the #new-type-form prefix outranks `#new-type-form textarea { font-family: inherit }`,
       so the canonical graph actually renders monospace (columns line up; JS width
       measurement is reliable) */
    #new-type-form #nt-canonical { flex: 3 1 18rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #nt-note      { flex: 2 1 10rem; }
    /* supertypes: a click-built chip set, not a free-text field */
    #nt-supers {
      display: flex;
      align-items: flex-start;    /* chips at top when the bar grows tall */
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 0.25rem;
      flex: 0 1 auto;             /* size to the chips; don't grow into unused space */
      min-width: 7rem;
      min-height: 1.6rem;
      padding: 0.28rem 0.4rem;     /* line the chips up with the textareas' first line */
      background: transparent;     /* a cell of the shared bar, not its own box */
    }
    #nt-supers-empty { color: #bbb; font-style: italic; }
    .nt-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 11px;
      padding: 0.05rem 0.4rem;
      background: #eef4ff;
      border: 1px solid #cdd9f0;
      border-radius: 10px;
      color: #33507a;
      cursor: pointer;
    }
    .nt-chip:hover { background: #e0e9fb; border-color: #a9bde8; }
    .nt-chip .x { color: #93a; font-size: 10px; opacity: 0.6; }
    /* the "+" adds a supertype: click it, then click one type. A pill button in the
       cell; the generic #new-type-form button rule is overridden here. */
    #nt-add-super {
      align-self: flex-start;
      font-size: 12px;
      line-height: 1;
      padding: 0.1rem 0.4rem;
      border: 1px solid #cdd9f0;
      border-radius: 10px;
      background: #eef4ff;
      color: #33507a;
      cursor: pointer;
    }
    /* Draw sits with the canonical field it acts on, matching the "+" pill
       rather than the Create/Cancel row — it opens an editor, it does not
       commit anything. */
    #new-type-form #nt-draw {
      align-self: flex-start;
      margin-top: 0.28rem;
      font-size: 11px;
      line-height: 1;
      padding: 0.18rem 0.4rem;
      border: 1px solid #cdd9f0;
      border-radius: 10px;
      background: #eef4ff;
      color: #33507a;
      cursor: pointer;
      flex-shrink: 0;
    }
    #new-type-form #nt-draw:hover { background: #e0e9fb; border-color: #a9bde8; }
    #nt-add-super:hover { background: #e0e9fb; border-color: #a9bde8; }
    #nt-add-super.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
    /* a sidebar type currently chosen as a supertype */
    .type-item.is-super { background: #eef4ff; box-shadow: inset 3px 0 0 #7a9fe0; }
    #new-type-form button {
      font-size: 11px;
      padding: 0.18rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    #new-type-form button:hover { background: #e8e8e8; border-color: #aaa; }
    /* Delete sits apart from Create/Save and reads destructive only once armed:
       unarmed it is quiet, so it does not compete with the action you actually
       came here to do. */
    #nt-delete { margin-left: 0.5rem; color: #a04040; border-color: #ddc4c4; }
    #nt-delete:hover { background: #fbeaea; border-color: #c88; }
    #nt-delete.armed,
    #nt-delete.armed:hover { background: #c0392b; border-color: #a5301f; color: #fff; }
    #nt-sep    { color: #999; }
    #nt-status { flex-basis: 100%; font-size: 11px; color: #aaa; }  /* comment on its own line below the fields+buttons row */
    #nt-status.error { color: #c0392b; }
    #new-type-form input.field-error,
    #new-type-form textarea.field-error {
      border-color: #c0392b;
      background: #fff6f6;
    }

    /* ── the relation form ──
       Deliberately built from the concept form's rules rather than its own set:
       the two are siblings, and a reader who has understood one should not have
       to learn a second visual language for the other. Only what genuinely
       differs — two type slots instead of one, and a role menu — is new. */
    #new-rel-form {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.35rem 0.6rem;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
    }
    #new-rel-form[hidden] { display: none; }
    #new-rel-form > input,
    #new-rel-form > span,
    #new-rel-form > button { margin-top: 1px; }
    #new-rel-form input,
    #new-rel-form select,
    #new-rel-form textarea {
      font-size: 12px;
      padding: 0.18rem 0.4rem;
      border: none;
      border-radius: 0;
      background: transparent;
      font-family: inherit;
    }
    #new-rel-form textarea {
      line-height: 1.4;
      resize: none;
      overflow-y: auto;
      min-height: 1.55rem;
      max-height: 12rem;
    }
    #nr-fields {
      display: flex;
      align-items: stretch;
      flex: 1 1 auto;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      overflow: hidden;
    }
    #new-rel-form #nr-fields > * + * { border-left: 1px solid #ccc; }
    #nr-fields > * { min-width: 0; }
    #nr-label { width: 8rem; flex-shrink: 0; text-transform: lowercase; }
    #nr-role  { flex: 0 0 auto; min-width: 6rem; cursor: pointer; }
    #nr-super { flex: 0 0 auto; min-width: 7rem; cursor: pointer; }
    #nr-prep  { width: 7rem; flex-shrink: 0; }
    #nr-desc  { flex: 3 1 14rem; }
    #nr-note  { flex: 2 1 8rem; }
    /* A preposition with no role to belong to is a field the server refuses,
       so it is dimmed rather than left looking usable. */
    #nr-prep:disabled { background: #f6f6f6; color: #bbb; cursor: not-allowed; }

    /* the two type slots — the same chip set the supertypes cell uses */
    .nr-slot {
      display: flex;
      align-items: flex-start;
      align-content: flex-start;
      flex-wrap: wrap;
      gap: 0.25rem;
      flex: 0 1 auto;
      min-width: 7rem;
      min-height: 1.6rem;
      padding: 0.28rem 0.4rem;
      background: transparent;
    }
    .nr-sep { color: #999; align-self: flex-start; margin: 0.12rem 0.15rem 0 0; font-size: 11px; }
    #nr-sources-empty, #nr-dest-empty { color: #bbb; font-style: italic; }
    #nr-add-source, #nr-add-dest {
      align-self: flex-start;
      font-size: 12px;
      line-height: 1;
      padding: 0.1rem 0.4rem;
      border: 1px solid #cdd9f0;
      border-radius: 10px;
      background: #eef4ff;
      color: #33507a;
      cursor: pointer;
    }
    #nr-add-source:hover, #nr-add-dest:hover { background: #e0e9fb; border-color: #a9bde8; }
    #nr-add-source.active, #nr-add-dest.active {
      background: #4a90d9; color: #fff; border-color: #4a90d9;
    }
    #new-rel-form button {
      font-size: 11px;
      padding: 0.18rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    #new-rel-form button:hover { background: #e8e8e8; border-color: #aaa; }
    #nr-delete { margin-left: 0.5rem; color: #a04040; border-color: #ddc4c4; }
    #nr-delete:hover { background: #fbeaea; border-color: #c88; }
    #nr-delete.armed,
    #nr-delete.armed:hover { background: #c0392b; border-color: #a5301f; color: #fff; }
    #nr-status { flex-basis: 100%; font-size: 11px; color: #aaa; }
    /* The roleless warning is advice, not an error: the write succeeded. Amber
       rather than the red #nt-status.error uses, so the difference is visible
       without reading the words. */
    #nr-status.warn  { color: #a76b2e; }
    #nr-status.error { color: #c0392b; }
    #new-rel-form input.field-error,
    #new-rel-form textarea.field-error {
      border-color: #c0392b;
      background: #fff6f6;
    }
    #save-btn { margin-left: auto; }
    #save-btn:disabled { color: #bbb; cursor: default; }
    #save-status {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
      align-self: center;
      margin-left: 0.4rem;
    }
    #save-status:not(:empty) { cursor: pointer; }
    #save-status:not(:empty):hover { color: #555; text-decoration: underline; }
    #init-btn:disabled { color: #bbb; cursor: default; }

    #options-btn.open { background: #4a90d9; color: #fff; border-color: #4a90d9; }

    /* ── options strip (inside CG pane, below header) ── */
    #cg-options {
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #eee;
      background: #f7f9ff;
      flex-shrink: 0;
    }

    .opt-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .opt-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .opt-btn {
      font-size: 11px;
      padding: 0.15rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    .opt-btn:hover:not(.active) { background: #eee; border-color: #aaa; }
    .opt-btn.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }

    #error-msg {
      padding: 0.4rem 0.75rem;
      font-size: 13px;
      flex-shrink: 0;
    }
    /* a temporary banner above the panes: red for errors, blue for prompts, gone when empty */
    #error-msg:empty { display: none; }
    #error-msg.is-error {
      color: #c0392b;
      background: #fdecea;
      border-bottom: 1px solid #f5c6cb;
    }
    #error-msg.is-info {
      color: #31708f;
      background: #eaf4fb;
      border-bottom: 1px solid #bce8f1;
    }

    /* ── body row ── */
    #body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── left sidebar (type list) ── */
    #sidebar {
      width: 190px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: none;
      overflow: hidden;
    }

    /* ── resizer between sidebar and graph area ── */
    #sidebar-resizer {
      width: 5px;
      flex-shrink: 0;
      background: #ddd;
      cursor: col-resize;
      transition: background 0.15s;
    }
    #sidebar-resizer:hover, #sidebar-resizer.dragging { background: #aaa; }

    /* Was a plain label; now two tabs. Keeps the old metrics so the sidebar
       header sits at exactly the height it always did. */
    #sidebar-header {
      display: flex;
      padding: 0.5rem 0.75rem 0.3rem;
      gap: 0.75rem;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .side-tab {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #bbb;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0 0 0.15rem;
      cursor: pointer;
      font-family: inherit;
    }
    .side-tab:hover { color: #888; }
    .side-tab.active { color: #555; border-bottom-color: #4a90d9; }

    #type-list, #relation-list {
      overflow-y: auto;
      flex: 1;
    }
    #type-list[hidden], #relation-list[hidden] { display: none; }

    /* A relation item says more than a concept item does, because a relation
       IS its signature — the name alone identifies nothing. */
    .rel-item {
      padding: 0.28rem 0.75rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
      border-bottom: 1px solid #f4f4f4;
    }
    .rel-item:hover { background: #f0f4ff; }
    .rel-item-name {
      text-transform: uppercase;
      font-size: 12px;
      color: #33507a;
    }
    .rel-item-sig {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* The role badge is the point of this list: it is the only place you can
       see, at a glance, which relations will never be spoken. */
    .rel-item-role {
      font-size: 10px;
      padding: 0 0.3rem;
      border-radius: 3px;
      background: #eef4ff;
      color: #33507a;
      margin-left: 0.3rem;
    }
    .rel-item-role.none {
      background: #fdf0e6;
      color: #a76b2e;
    }
    /* A role that came from a supertype rather than from this relation's own
       definition. Same information, visibly second-hand — otherwise the list
       shows a role the definition does not contain. */
    .rel-item-role.inherited {
      background: #f2f2f2;
      color: #888;
      font-style: italic;
    }
    .rel-item-super { font-size: 10px; color: #8a7; margin-left: 0.3rem; }

    .type-item {
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
      text-transform: uppercase;
    }
    .type-item:hover { background: #f0f4ff; }
    .type-item.selected {
      color: #aaa;
      font-style: italic;
    }

    /* ── graph area ── */
    #graph-area {
      flex: 1;
      overflow: auto;
      padding: 0.75rem 0.75rem 0.5rem;
      min-height: 0;
    }

    #graph-container {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 80px;
      padding: 0.5rem;
      display: inline-block;
      min-width: 100%;
    }

    #graph-container svg { display: block; }

    #placeholder {
      color: #bbb;
      padding: 2rem;
      text-align: center;
      /* The relations-tab wording is a sentence rather than a phrase, so cap the
         measure: centred text set to the full width of the graph area is hard to
         read back to the start of the next line. */
      max-width: 34rem;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── resizer between graph area and CG pane ── */
    #cg-resizer {
      width: 5px;
      flex-shrink: 0;
      background: #ddd;
      cursor: col-resize;
      transition: background 0.15s;
    }
    #cg-resizer:hover, #cg-resizer.dragging { background: #aaa; }

    /* ── right pane: canonical graphs ── */
    #cg-pane {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-left: none;
      overflow: hidden;
    }

    #cg-pane-header {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.75rem 0.3rem;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    #cg-clear-btn {
      margin-left: auto;
      font-size: 10px;
      padding: 0.12rem 0.45rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #777;
      cursor: pointer;
    }
    #cg-clear-btn:hover { background: #eee; border-color: #aaa; }

    #cg-entries {
      flex: 1;
      overflow-y: auto;
    }

    #cg-placeholder {
      padding: 2rem 0.75rem;
      color: #ccc;
      font-style: italic;
      font-size: 12px;
      text-align: center;
    }

    .cg-entry {
      border-bottom: 1px solid #eee;
      padding: 0.5rem 0.75rem;
    }

    .cg-entry-head {
      display: flex;
      align-items: center;
      margin-bottom: 0.3rem;
    }

    .cg-entry-name {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      color: #333;
    }

    .cg-entry-remove {
      margin-left: auto;
      font-size: 11px;
      color: #ccc;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0 0.1rem;
      line-height: 1;
    }
    .cg-entry-remove:hover { color: #c0392b; }

    .cg-entry-body {
      font-family: monospace;
      font-size: 11.5px;
      color: #555;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .cg-entry-body svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .cg-entry-body pre.cg-linear {
      margin: 0;
      font-family: monospace;
      font-size: 11.5px;
      color: #555;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
    }

    .cg-entry-body.empty { color: #bbb; font-style: italic; }
    .cg-entry-body.loading { color: #bbb; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="top-bar-label">Graphing:</span>
    <div id="chips"></div>
    <button id="save-btn" title="Save graph to data directory" disabled>Save</button>
    <span id="save-status"></span>
    <button id="init-btn" title="Reinitialize concept types">Initialize</button>
    <button id="new-type-btn" title="Create a new concept type">New Type</button>
    <button id="edit-type-btn" title="Edit an existing concept type">Edit Type</button>
    <button id="new-rel-btn" title="Create a new relation type">New Relation</button>
    <button id="options-btn" title="Display options">Options</button>
    <button id="editor-btn" title="Open the graph editor on an empty graph">Editor</button>
  </div>

  <div id="new-type-form" hidden>
    <div id="nt-fields">
      <input id="nt-label" type="text" placeholder="new type name" autocomplete="off" spellcheck="false">
      <div id="nt-supers" title="click a chip to remove it; click + then a type to add one">
        <span id="nt-sep" title="subtype of">⊑</span>
        <span id="nt-supers-empty">click + then a type</span>
        <button id="nt-add-super" type="button" title="add a supertype: click, then click one type in the list or graph">+</button>
      </div>
      <textarea id="nt-canonical" rows="1" placeholder="canonical graph (optional)" autocomplete="off" spellcheck="false"></textarea>
      <!-- Draws the canonical graph in the editor instead of typing linear
           notation by hand. Inside the canonical cell, because it acts on that
           field and nothing else. -->
      <button id="nt-draw" type="button" title="Draw this canonical graph in the graph editor">Draw…</button>
      <textarea id="nt-note" rows="1" placeholder="note (optional)" autocomplete="off" spellcheck="false"></textarea>
    </div>
    <button id="nt-create">Create</button>
    <button id="nt-save" hidden>Save Type Definition</button>
    <!-- Editing only: turns the open type into the starting point for a new one.
         Pure client state — the fields are already filled, so this only clears
         the identity and switches Save back to Create. -->
    <button id="nt-duplicate" hidden title="Start a new type from this one's supertypes, canonical graph and note">Duplicate</button>
    <button id="nt-cancel">Cancel</button>
    <!-- Editing only, and two-step: the first click arms it, the second commits.
         An in-page arm rather than confirm(), because a modal blocks the page
         and reads as heavier than the act deserves — this is a leaf type with
         nothing attached, or the server would have refused it.

         LAST in the row, and its label never changes, both for the same reason:
         arming must not move any other control. A first version put it before
         Cancel and widened it to "Delete xat — click again", which shifted
         Cancel out from under the pointer — so the click meant to back out
         landed on the armed button and committed the delete. The confirmation
         wording lives in the hint line below instead, where it costs no width. -->
    <button id="nt-delete" hidden title="Delete this type (refused if anything still uses it)">Delete</button>
    <span id="nt-status"></span>
  </div>

  <!-- The relation form is a sibling of the concept form, not a mode of it: it
       takes different fields (a signature, not a lattice position) and they are
       never open at once. It sits in the same place for the same reason the
       concept form does — the graph below must stay visible and clickable,
       because that is where source and destination types are picked from. -->
  <div id="new-rel-form" hidden>
    <div id="nr-fields">
      <input id="nr-label" type="text" placeholder="relation name" autocomplete="off" spellcheck="false">
      <!-- A relation may sit under another, which is what lets a new one inherit
           a signature and a syntax role instead of restating both. A menu, not
           the "+" picker the type slots use: the choices are relations, and the
           relation list is right there in the sidebar rather than in the graph. -->
      <select id="nr-super" title="inherit signature and syntax role from this relation"></select>
      <div id="nr-sources" class="nr-slot" title="source types: click + then a type">
        <span class="nr-sep" title="from">from</span>
        <span id="nr-sources-empty">click + then a type</span>
        <button id="nr-add-source" type="button" title="add a source type: click, then click one type in the list or graph">+</button>
      </div>
      <div id="nr-dest" class="nr-slot" title="destination type: click + then a type">
        <span class="nr-sep" title="to">→ to</span>
        <span id="nr-dest-empty">click + then a type</span>
        <button id="nr-add-dest" type="button" title="set the destination type: click, then click one type in the list or graph">+</button>
      </div>
      <!-- Role and preposition decide whether the relation is ever spoken.
           A relation with no role is legal and silently absent from generated
           English, so the menu is present on the form rather than tucked away. -->
      <select id="nr-role" title="how this relation surfaces in English"></select>
      <input id="nr-prep" type="text" placeholder="preposition" autocomplete="off" spellcheck="false"
             title="only :pp and :iobj use a preposition">
      <textarea id="nr-desc" rows="1" placeholder="description (optional)" autocomplete="off" spellcheck="false"></textarea>
      <textarea id="nr-note" rows="1" placeholder="note (optional)" autocomplete="off" spellcheck="false"></textarea>
    </div>
    <button id="nr-create">Create</button>
    <button id="nr-save" hidden>Save Relation</button>
    <button id="nr-duplicate" hidden title="Start a new relation from this one's signature, role and description">Duplicate</button>
    <button id="nr-cancel">Cancel</button>
    <!-- Same two-step arming as #nt-delete, and last in the row for the same
         reason: arming must not move any control out from under the pointer. -->
    <button id="nr-delete" hidden title="Delete this relation (refused if a canonical graph still uses it)">Delete</button>
    <span id="nr-status"></span>
  </div>

  <div id="error-msg"></div>

  <div id="body-row">

    <div id="sidebar">
      <!-- Two tabs rather than two stacked lists: the catalogs are browsed one
           at a time, and stacking them would halve the height of the concept
           list, which is the one in constant use. -->
      <div id="sidebar-header">
        <button class="side-tab active" data-tab="concepts">Concept Types</button>
        <button class="side-tab" data-tab="relations">Relation Types</button>
      </div>
      <div id="type-list"></div>
      <div id="relation-list" hidden></div>
    </div>

    <div id="sidebar-resizer"></div>

    <div id="graph-area">
      <div id="graph-container">
        <div id="placeholder">Select a type from the list on the left.</div>
      </div>
    </div>

    <div id="cg-resizer"></div>

    <div id="cg-pane">
      <div id="cg-pane-header">
        Canonical Graphs
        <button id="cg-clear-btn">Clear</button>
      </div>
      <div id="cg-options" hidden>
        <div class="opt-row">
          <span class="opt-label">View</span>
          <!-- The active button is set by syncDisplayModeButtons() once the CL
               option *canonical-graph-format* has been read; marking Linear
               here just matches graph.js's fallback so there's no flash. -->
          <button class="opt-btn" data-mode="graph">Graph</button>
          <button class="opt-btn active" data-mode="linear">Linear</button>
        </div>
      </div>
      <div id="cg-entries">
        <div id="cg-placeholder">Click a node to pin its canonical graph here.</div>
      </div>
    </div>

  </div>

  <script type="module" src="/graph.js"></script>
</body>
</html>
