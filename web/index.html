<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGraph Type Browser</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── top bar ── */
    #top-bar {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
      min-height: 2.5rem;
      flex-shrink: 0;
    }

    #top-bar-label {
      color: #888;
      white-space: nowrap;
      line-height: 1.8rem;
      flex-shrink: 0;
    }

    #chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      background: #4a90d9;
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
      transition: background 0.15s;
      text-transform: uppercase;
    }
    .chip:hover { background: #c0392b; }
    .chip-x { font-size: 11px; opacity: 0.8; }

    #save-btn, #init-btn, #new-type-btn {
      align-self: center;
      flex-shrink: 0;
      font-size: 11px;
      padding: 0.18rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    #new-type-btn { margin-left: 0.4rem; }
    #new-type-btn:hover { background: #e8e8e8; border-color: #aaa; }

    #new-type-form {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.35rem 0.6rem;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
    }
    #new-type-form[hidden] { display: none; }
    #new-type-form input {
      font-size: 12px;
      padding: 0.18rem 0.4rem;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    #nt-label     { width: 9rem; }
    #nt-canonical { flex: 2; min-width: 8rem; }
    #nt-note      { flex: 1; min-width: 6rem; }
    /* supertypes: a click-built chip set, not a free-text field */
    #nt-supers {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.25rem;
      flex: 1;
      min-width: 12rem;
      min-height: 1.6rem;
      padding: 0.1rem 0.3rem;
      border: 1px dashed #ccc;
      border-radius: 3px;
      background: #fff;
    }
    #nt-supers-empty { color: #bbb; font-style: italic; }
    .nt-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 11px;
      padding: 0.05rem 0.4rem;
      background: #eef4ff;
      border: 1px solid #cdd9f0;
      border-radius: 10px;
      color: #33507a;
      cursor: pointer;
    }
    .nt-chip:hover { background: #e0e9fb; border-color: #a9bde8; }
    .nt-chip .x { color: #93a; font-size: 10px; opacity: 0.6; }
    /* a sidebar type currently chosen as a supertype */
    .type-item.is-super { background: #eef4ff; box-shadow: inset 3px 0 0 #7a9fe0; }
    #new-type-form button {
      font-size: 11px;
      padding: 0.18rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    #new-type-form button:hover { background: #e8e8e8; border-color: #aaa; }
    #nt-sep    { color: #999; }
    #nt-status { font-size: 11px; color: #aaa; }
    #nt-status.error { color: #c0392b; }
    #new-type-form input.field-error {
      border-color: #c0392b;
      background: #fff6f6;
    }
    #save-btn { margin-left: auto; }
    #save-btn:hover:not(:disabled) { background: #e8e8e8; border-color: #aaa; }
    #save-btn:disabled { color: #bbb; cursor: default; }
    #save-status {
      font-size: 13px;
      color: #aaa;
      white-space: nowrap;
      align-self: center;
      margin-left: 0.4rem;
    }
    #save-status:not(:empty) { cursor: pointer; }
    #save-status:not(:empty):hover { color: #555; text-decoration: underline; }
    #init-btn { margin-left: 0.4rem; }
    #init-btn:hover:not(:disabled) { background: #e8e8e8; border-color: #aaa; }
    #init-btn:disabled { color: #bbb; cursor: default; }

    #options-btn {
      align-self: center;
      flex-shrink: 0;
      font-size: 11px;
      padding: 0.18rem 0.55rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
      margin-left: 0.4rem;
    }
    #options-btn:hover { background: #e8e8e8; border-color: #aaa; }
    #options-btn.open { background: #4a90d9; color: #fff; border-color: #4a90d9; }

    /* ── options strip (inside CG pane, below header) ── */
    #cg-options {
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #eee;
      background: #f7f9ff;
      flex-shrink: 0;
    }

    .opt-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .opt-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .opt-btn {
      font-size: 11px;
      padding: 0.15rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #555;
      cursor: pointer;
    }
    .opt-btn:hover:not(.active) { background: #eee; border-color: #aaa; }
    .opt-btn.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }

    #error-msg {
      color: #c00;
      padding: 0.25rem 0.75rem;
      font-size: 13px;
      flex-shrink: 0;
    }

    /* ── body row ── */
    #body-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── left sidebar (type list) ── */
    #sidebar {
      width: 190px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 0.5rem 0.75rem 0.3rem;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    #type-list {
      overflow-y: auto;
      flex: 1;
    }

    .type-item {
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
      text-transform: uppercase;
    }
    .type-item:hover { background: #f0f4ff; }
    .type-item.selected {
      color: #aaa;
      font-style: italic;
    }

    /* ── graph area ── */
    #graph-area {
      flex: 1;
      overflow: auto;
      padding: 0.75rem 0.75rem 0.5rem;
      min-height: 0;
    }

    #graph-container {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 80px;
      padding: 0.5rem;
      display: inline-block;
      min-width: 100%;
    }

    #graph-container svg { display: block; }

    #placeholder {
      color: #bbb;
      padding: 2rem;
      text-align: center;
    }

    /* ── resizer between graph area and CG pane ── */
    #cg-resizer {
      width: 5px;
      flex-shrink: 0;
      background: #ddd;
      cursor: col-resize;
      transition: background 0.15s;
    }
    #cg-resizer:hover, #cg-resizer.dragging { background: #aaa; }

    /* ── right pane: canonical graphs ── */
    #cg-pane {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-left: none;
      overflow: hidden;
    }

    #cg-pane-header {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.75rem 0.3rem;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    #cg-clear-btn {
      margin-left: auto;
      font-size: 10px;
      padding: 0.12rem 0.45rem;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #f7f7f7;
      color: #777;
      cursor: pointer;
    }
    #cg-clear-btn:hover { background: #eee; border-color: #aaa; }

    #cg-entries {
      flex: 1;
      overflow-y: auto;
    }

    #cg-placeholder {
      padding: 2rem 0.75rem;
      color: #ccc;
      font-style: italic;
      font-size: 12px;
      text-align: center;
    }

    .cg-entry {
      border-bottom: 1px solid #eee;
      padding: 0.5rem 0.75rem;
    }

    .cg-entry-head {
      display: flex;
      align-items: center;
      margin-bottom: 0.3rem;
    }

    .cg-entry-name {
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      color: #333;
    }

    .cg-entry-remove {
      margin-left: auto;
      font-size: 11px;
      color: #ccc;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0 0.1rem;
      line-height: 1;
    }
    .cg-entry-remove:hover { color: #c0392b; }

    .cg-entry-body {
      font-family: monospace;
      font-size: 11.5px;
      color: #555;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .cg-entry-body svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .cg-entry-body pre.cg-linear {
      margin: 0;
      font-family: monospace;
      font-size: 11.5px;
      color: #555;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
    }

    .cg-entry-body.empty { color: #bbb; font-style: italic; }
    .cg-entry-body.loading { color: #bbb; }
  </style>
</head>
<body>

  <div id="top-bar">
    <span id="top-bar-label">Graphing:</span>
    <div id="chips"></div>
    <button id="save-btn" title="Save graph to data directory" disabled>Save</button>
    <span id="save-status"></span>
    <button id="init-btn" title="Reinitialize concept types">Initialize</button>
    <button id="new-type-btn" title="Create a new concept type">New Type</button>
    <button id="options-btn" title="Display options">Options</button>
  </div>

  <div id="new-type-form" hidden>
    <input id="nt-label" type="text" placeholder="new type name" autocomplete="off" spellcheck="false">
    <span id="nt-sep" title="subtype of">⊑</span>
    <div id="nt-supers" title="click a type in the list or graph to add it; click a chip to remove">
      <span id="nt-supers-empty">click types to add as supertypes</span>
    </div>
    <input id="nt-canonical" type="text" placeholder="canonical graph (optional)" autocomplete="off" spellcheck="false">
    <input id="nt-note" type="text" placeholder="note (optional)" autocomplete="off" spellcheck="false">
    <button id="nt-create">Create</button>
    <button id="nt-cancel">Cancel</button>
    <span id="nt-status"></span>
  </div>

  <div id="error-msg"></div>

  <div id="body-row">

    <div id="sidebar">
      <div id="sidebar-header">Concept Types</div>
      <div id="type-list"></div>
    </div>

    <div id="graph-area">
      <div id="graph-container">
        <div id="placeholder">Select a type from the list on the left.</div>
      </div>
    </div>

    <div id="cg-resizer"></div>

    <div id="cg-pane">
      <div id="cg-pane-header">
        Canonical Graphs
        <button id="cg-clear-btn">Clear</button>
      </div>
      <div id="cg-options" hidden>
        <div class="opt-row">
          <span class="opt-label">View</span>
          <button class="opt-btn active" data-mode="graph">Graph</button>
          <button class="opt-btn" data-mode="linear">Linear</button>
        </div>
      </div>
      <div id="cg-entries">
        <div id="cg-placeholder">Click a node to pin its canonical graph here.</div>
      </div>
    </div>

  </div>

  <script type="module" src="/graph.js"></script>
</body>
</html>
